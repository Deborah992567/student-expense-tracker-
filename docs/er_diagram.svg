<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <style>
    .box { fill:#fff;stroke:#333;stroke-width:1.5 }
    .title { font: bold 14px sans-serif }
    .col { font: 12px monospace }
    .arrow { stroke:#333; stroke-width:1.2; fill:none; marker-end:url(#arrowhead) }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- users box -->
  <rect x="20" y="20" width="220" height="120" class="box" rx="6"/>
  <text x="30" y="40" class="title">users</text>
  <text x="30" y="60" class="col">id (PK)</text>
  <text x="30" y="76" class="col">email (unique)</text>
  <text x="30" y="92" class="col">password_hash</text>
  <text x="30" y="108" class="col">email_verified, allowance, ...</text>

  <!-- categories box -->
  <rect x="260" y="20" width="240" height="90" class="box" rx="6"/>
  <text x="270" y="40" class="title">categories</text>
  <text x="270" y="60" class="col">id (PK)</text>
  <text x="270" y="76" class="col">user_id (FK → users.id)</text>
  <text x="270" y="92" class="col">name, budget, color</text>

  <!-- expenses box -->
  <rect x="260" y="130" width="320" height="120" class="box" rx="6"/>
  <text x="270" y="150" class="title">expenses</text>
  <text x="270" y="170" class="col">id (PK)</text>
  <text x="270" y="186" class="col">user_id (FK → users.id)</text>
  <text x="270" y="202" class="col">name, amount, category, date</text>
  <text x="270" y="218" class="col">deleted (bool), deleted_at</text>

  <!-- goals box -->
  <rect x="600" y="20" width="240" height="90" class="box" rx="6"/>
  <text x="610" y="40" class="title">goals</text>
  <text x="610" y="60" class="col">id (PK)</text>
  <text x="610" y="76" class="col">user_id (FK → users.id)</text>
  <text x="610" y="92" class="col">name, target, saved</text>

  <!-- refresh_tokens box -->
  <rect x="600" y="130" width="240" height="120" class="box" rx="6"/>
  <text x="610" y="150" class="title">refresh_tokens</text>
  <text x="610" y="170" class="col">id (PK)</text>
  <text x="610" y="186" class="col">jti (unique), user_id (FK → users.id)</text>
  <text x="610" y="202" class="col">token_hash, revoked, expires_at</text>

  <!-- user_settings box -->
  <rect x="20" y="160" width="220" height="90" class="box" rx="6"/>
  <text x="30" y="180" class="title">user_settings</text>
  <text x="30" y="200" class="col">id (PK)</text>
  <text x="30" y="216" class="col">user_id (FK → users.id, unique)</text>
  <text x="30" y="232" class="col">country, savings_currencies (JSON)</text>

  <!-- email_verification_codes box -->
  <rect x="20" y="270" width="220" height="90" class="box" rx="6"/>
  <text x="30" y="290" class="title">email_verification_codes</text>
  <text x="30" y="310" class="col">id (PK)</text>
  <text x="30" y="326" class="col">user_id (FK → users.id)</text>
  <text x="30" y="342" class="col">code_hash, expires_at, attempts</text>

  <!-- arrows -->
  <path d="M240 80 L260 80" class="arrow" />
  <path d="M240 180 L260 180" class="arrow" />
  <path d="M400 180 L600 180" class="arrow" />
  <path d="M260 60 L600 60" class="arrow" />
  <path d="M120 200 L120 270" class="arrow" />

  <text x="420" y="40" font-size="12" fill="#333">user relations (FK)</text>
</svg>
